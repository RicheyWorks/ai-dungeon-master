# Activate with: --spring.profiles.active=prod   OR   game.production=true
# Fails boot if secrets are still insecure — see docs/PRODUCTION.md

game.production=true
game.gui.enabled=false
game.auth.enabled=true

# MUST override these via env / secrets manager in real deploys:
#   GAME_AUTH_JWT_SECRET
#   GAME_AUTH_JDBC_PASSWORD  (when store=jdbc)
#   STOREFRONT_* secrets or live credentials

# Multi-node defaults (override as needed)
game.auth.session.store=jdbc
game.auth.entitlement.store=jdbc
game.auth.jwt.ttl-seconds=86400

game.instances.autoload=true
game.instances.save-on-evict=true

# Tighter public limits in prod (override via env if scrapers share a NAT)
game.rate-limit.enabled=true
game.rate-limit.trust-forwarded-headers=true
game.rate-limit.store=redis
game.rate-limit.session-per-minute=20
game.rate-limit.logout-per-minute=15
game.rate-limit.admin-per-minute=20
game.rate-limit.install-per-minute=10
game.rate-limit.narrate-per-minute=12
game.rate-limit.action-per-minute=40
game.rate-limit.save-per-minute=20
game.rate-limit.metrics-per-minute=60
game.rate-limit.verify-per-minute=40
game.marketplace.require-checksums=true
game.marketplace.jobs.store=redis
game.auth.receipt-ledger.store=redis
# DB-only multi-node: game.auth.receipt-ledger.store=jdbc
# Set a strong secret in deployment env GAME_ADMIN_TOKEN / game.admin.token
game.admin.token=${GAME_ADMIN_TOKEN:}
game.content.session-packs.store=redis
# DB-only multi-node: game.content.session-packs.store=jdbc

# Require explicit origins in production (env GAME_CORS_ALLOWED_ORIGINS)
game.cors.allowed-origins=${GAME_CORS_ALLOWED_ORIGINS:}
game.security.hsts.enabled=true

server.tomcat.max-http-form-post-size=512KB
server.tomcat.max-swallow-size=512KB
server.tomcat.max-http-header-size=8KB
game.http.max-request-bytes=524288
game.marketplace.max-download-bytes=12582912
game.legacy.api.enabled=false

# Plugin / metrics / WS hardening
game.plugins.signature.policy=REQUIRED
game.plugins.sandbox.enabled=true
game.metrics.scrape-token=${GAME_METRICS_SCRAPE_TOKEN:}
game.metrics.scrape-token.previous=${GAME_METRICS_SCRAPE_TOKEN_PREVIOUS:}
game.ws.message-size-limit=262144
game.ws.send-buffer-size-limit=524288

game.catalog.upload.enabled=true
game.catalog.upload.require-admin=true
game.admin.token.previous=${GAME_ADMIN_TOKEN_PREVIOUS:}
