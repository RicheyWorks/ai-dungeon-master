# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── Game Configuration ───────────────────────────────────────────────────────
game.difficulty=4
game.chaos=4

# Comma-separated; index-matched to game.party.roles
game.party.names=Kael,Lira
game.party.roles=Warrior,Mage

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.xai.dungeonmaster=DEBUG

# ─── GUI ──────────────────────────────────────────────────────────────────────
# Set to false to run headless (web/REST/WebSocket only, no Swing window)
game.gui.enabled=true

# --- Narration (LLM provider) ---
# Active provider id; "local-stub" is the offline, no-key default narrator.
game.narration.provider=local-stub
# Per-session token ceiling for the cost guardrail.
game.narration.token.ceiling=4000

# ─── Auth (session identity + JWT) ────────────────────────────────────────────
# Enforcement is opt-in. When false, /v2 endpoints stay open and identity is
# best-effort (a valid token is still resolved and attached when present).
# When true (or spring profile "prod"), ProductionSecurityGuard fails boot on weak secrets.
game.production=false
game.auth.enabled=false
# HMAC-SHA256 secret for signing session tokens. Leave blank for an insecure
# dev secret (a warning is logged); set a strong value before enabling auth.
game.auth.jwt.secret=
# Token lifetime in seconds (default 24h).
game.auth.jwt.ttl-seconds=86400

# ─── Rate limits (public / abuse-prone endpoints) ─────────────────────────────
# Fixed-window per client IP. Disable for load tests if needed.
game.rate-limit.enabled=true
game.rate-limit.store=memory
game.rate-limit.session-per-minute=30
game.rate-limit.logout-per-minute=20
game.rate-limit.admin-per-minute=30
game.rate-limit.metrics-per-minute=120
game.rate-limit.verify-per-minute=60
game.rate-limit.default-per-minute=120
# ─── Plugins ──────────────────────────────────────────────────────────────────
# Signature policy for code-bearing plugin JARs: LENIENT, REQUIRED, or DISABLED.
game.plugins.signature.policy=LENIENT
# Sandbox plugin bytecode: reject JARs referencing blocked APIs (process exec,
# reflection, raw net/fs, classloaders, JDK internals) and native methods before
# loading. Set false to disable.
game.plugins.sandbox.enabled=true
# Runtime wall-clock timeout for plugin SPI calls (item/spell effects). A hung
# mod cannot freeze the game loop; set game.plugins.call.guard=false to disable.
game.plugins.call.timeout-ms=2000
game.plugins.call.guard=true
# --- Narration providers (keyed) ---
# Select with game.narration.provider = openai | xai | anthropic | llama | local-stub.
# Keys/models come from env (or -D): e.g. OPENAI_API_KEY, OPENAI_MODEL, ANTHROPIC_API_KEY,
# XAI_API_KEY, LLAMA_BASE_URL. A provider with no key reports DOWN and the registry
# transparently falls back to the offline local-stub narrator.
# --- Content-pack upload (POST /v2/catalog/packs) ---
# Raw multipart limits; the service additionally caps uncompressed size at 20 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# Session store: memory | file | redis | jdbc
#   memory — process-local (default)
#   file   — JSON + cross-process lock (shared volume multi-node)
#   redis  — shared Redis (set game.auth.redis.url)
#   jdbc   — shared SQL database (Postgres recommended; set game.auth.jdbc.url)
#   postgres is accepted as an alias for jdbc
game.auth.session.store=memory
# When store=file, the JSON file sessions are persisted to (relative to the working dir).
game.auth.session.file=sessions.json
# Entitlement store: same memory|file|redis|jdbc choice as sessions.
game.auth.entitlement.store=memory
game.auth.entitlement.file=entitlements.json
# Redis (when either store=redis). Shared JWT secret is still required across nodes.
game.auth.redis.url=redis://127.0.0.1:6379
game.auth.redis.key-prefix=dm
# JDBC (when either store=jdbc|postgres). Schema auto-created (dm_sessions, dm_entitlements).
game.auth.jdbc.url=
game.auth.jdbc.username=
game.auth.jdbc.password=
# Optional; leave blank to auto-detect (org.postgresql.Driver / org.h2.Driver).
game.auth.jdbc.driver=
# Per-session game saves (authenticated v2 clients each get their own engine + file).
game.saves.dir=saves
# Idle TTL for per-session engines (seconds). 0 disables idle eviction.
game.instances.idle-ttl-seconds=3600
# Max concurrent per-session engines; LRU is evicted when the cap is hit.
game.instances.max=100
# Auto-save a session's world when its engine is evicted/destroyed.
game.instances.save-on-evict=true
# On first mint after disconnect/eviction, restore the session save if present.
game.instances.autoload=true
# How often the reaper runs (ms).
game.instances.reap-interval-ms=60000
game.instances.reaper.enabled=true

# ─── Marketplace ──────────────────────────────────────────────────────────────
# Optional remote pack index (JSON). Empty = local content-packs dir only.
# game.marketplace.remote-url=https://cdn.example.com/dm/marketplace.json
game.marketplace.remote-url=
game.marketplace.remote-cache-seconds=300
game.marketplace.require-checksums=false
game.marketplace.remote-hmac-secret=
# Install job snapshots: memory | redis (multi-node progress poll)
game.marketplace.jobs.store=memory
game.marketplace.jobs.ttl-seconds=3600

# ─── Storefront live credentials (optional) ──────────────────────────────────
# Mapped to STOREFRONT_* system properties on boot (see StorefrontConfig).
game.storefront.google.package-name=
game.storefront.google.access-token=
game.storefront.google.service-account-json=
game.storefront.google.sandbox-secret=
game.storefront.google.auto-acknowledge=true
game.storefront.google.auto-consume=false
game.storefront.apple.shared-secret=
game.storefront.apple.bundle-id=
game.storefront.apple.sandbox-secret=
game.storefront.steam.publisher-key=
game.storefront.steam.app-id=
game.storefront.steam.sandbox=false
game.storefront.steam.hmac-secret=
# Require store SKUs listed in pack.yaml to enable content packs
game.content.entitlement-gates=true

# One-time receipt ledger (anti-replay). store=memory|redis
game.auth.receipt-ledger.enabled=true
game.auth.receipt-ledger.store=memory
# memory | redis | jdbc
game.auth.receipt-ledger.ttl-seconds=7776000
# After store grant, enable packs gated by that SKU
game.content.auto-enable-on-grant=true

# Ops admin API (blank = disabled). Header: X-Admin-Token
game.admin.token=
# Per-session pack enable (multi-tenant). false = process-wide toggles
game.content.session-scoped-enable=true

# Session pack enable overrides: memory | redis | jdbc
game.content.session-packs.store=memory

# Idle session purge (also clears session pack overrides)
game.auth.session.hygiene.enabled=true
game.auth.session.idle-ttl-seconds=86400
game.auth.session.hygiene-interval-ms=300000
