[package]
name = "ai-dungeon-master-desktop"
version = "1.0.0"
description = "Native window for AI Dungeon Master (loads the engine web SPA)"
authors = ["xAI / RicheyWorks"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
