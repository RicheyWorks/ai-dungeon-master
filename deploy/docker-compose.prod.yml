# Production-shaped overlay: secrets from env file, prod profile, TLS nginx.
#
#   cp deploy/.env.example deploy/.env   # edit secrets
#   ./scripts/gen-secrets.sh >> deploy/.env
#   # set GAME_CORS_ALLOWED_ORIGINS + DOMAIN
#   mkdir -p deploy/certs && cp fullchain.pem privkey.pem deploy/certs/
#   docker compose --env-file deploy/.env \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.prod.yml \
#     up --build -d
#
# Requires GAME_PRODUCTION / strong JWT / admin token / CORS allow-list or apps
# will refuse to boot (ProductionSecurityGuard).

x-app-prod-env: &app_prod_env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  GAME_PRODUCTION: ${GAME_PRODUCTION:-true}
  GAME_AUTH_ENABLED: ${GAME_AUTH_ENABLED:-true}
  GAME_AUTH_JWT_SECRET: ${GAME_AUTH_JWT_SECRET:?set GAME_AUTH_JWT_SECRET}
  GAME_AUTH_JWT_TTL_SECONDS: ${GAME_AUTH_JWT_TTL_SECONDS:-86400}
  GAME_AUTH_SESSION_STORE: ${GAME_AUTH_SESSION_STORE:-jdbc}
  GAME_AUTH_ENTITLEMENT_STORE: ${GAME_AUTH_ENTITLEMENT_STORE:-jdbc}
  GAME_AUTH_JDBC_URL: ${GAME_AUTH_JDBC_URL:-jdbc:postgresql://postgres:5432/dungeon}
  GAME_AUTH_JDBC_USERNAME: ${GAME_AUTH_JDBC_USERNAME:-dm}
  GAME_AUTH_JDBC_PASSWORD: ${GAME_AUTH_JDBC_PASSWORD:?set GAME_AUTH_JDBC_PASSWORD}
  GAME_AUTH_JDBC_DRIVER: ${GAME_AUTH_JDBC_DRIVER:-org.postgresql.Driver}
  GAME_AUTH_REDIS_URL: ${GAME_AUTH_REDIS_URL:-redis://redis:6379}
  GAME_AUTH_REDIS_KEY_PREFIX: ${GAME_AUTH_REDIS_KEY_PREFIX:-dm}
  GAME_ADMIN_TOKEN: ${GAME_ADMIN_TOKEN:?set GAME_ADMIN_TOKEN}
  GAME_CORS_ALLOWED_ORIGINS: ${GAME_CORS_ALLOWED_ORIGINS:?set GAME_CORS_ALLOWED_ORIGINS}
  GAME_RATE_LIMIT_STORE: ${GAME_RATE_LIMIT_STORE:-redis}
  GAME_RATE_LIMIT_TRUST_FORWARDED_HEADERS: ${GAME_RATE_LIMIT_TRUST_FORWARDED_HEADERS:-true}
  GAME_AUTH_RECEIPT_LEDGER_STORE: ${GAME_AUTH_RECEIPT_LEDGER_STORE:-redis}
  GAME_CONTENT_SESSION_PACKS_STORE: ${GAME_CONTENT_SESSION_PACKS_STORE:-redis}
  GAME_MARKETPLACE_JOBS_STORE: ${GAME_MARKETPLACE_JOBS_STORE:-redis}
  GAME_CONTENT_PACKS_DIR: ${GAME_CONTENT_PACKS_DIR:-/data/packs}
  GAME_SAVES_DIR: ${GAME_SAVES_DIR:-/data/saves}
  GAME_LEGACY_API_ENABLED: ${GAME_LEGACY_API_ENABLED:-false}
  STOREFRONT_DEV_SECRET: ${STOREFRONT_DEV_SECRET:-}
  STOREFRONT_GOOGLE_SECRET: ${STOREFRONT_GOOGLE_SECRET:-}
  STOREFRONT_APPLE_SECRET: ${STOREFRONT_APPLE_SECRET:-}
  STOREFRONT_STEAM_SECRET: ${STOREFRONT_STEAM_SECRET:-}
  STOREFRONT_GOOGLE_ACCESS_TOKEN: ${STOREFRONT_GOOGLE_ACCESS_TOKEN:-}
  STOREFRONT_APPLE_SHARED_SECRET: ${STOREFRONT_APPLE_SHARED_SECRET:-}
  STOREFRONT_STEAM_PUBLISHER_KEY: ${STOREFRONT_STEAM_PUBLISHER_KEY:-}

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dungeon}
      POSTGRES_USER: ${POSTGRES_USER:-dm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}

  app1:
    environment:
      <<: *app_prod_env
    volumes:
      - saves:/data/saves
      - ../content-packs:/data/packs:ro

  app2:
    environment:
      <<: *app_prod_env
    volumes:
      - saves:/data/saves
      - ../content-packs:/data/packs:ro

  proxy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  packs:
