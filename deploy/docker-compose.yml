# Multi-node AI Dungeon Master stack:
#   postgres + redis (shared auth) → app1 + app2 (engines) → nginx (sticky)
#
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://localhost:8080/app/
#
# Auth: JDBC sessions/entitlements on Postgres. Shared saves volume for autoload.
# Sticky routing (ip_hash) keeps a player on one app node for live STOMP + engines.

name: ai-dungeon-master

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dungeon
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: dm-dev-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm -d dungeon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    build:
      context: ..
      dockerfile: Dockerfile
    environment: &app_env
      SERVER_PORT: "8080"
      GAME_GUI_ENABLED: "false"
      GAME_SAVES_DIR: /data/saves
      GAME_AUTH_ENABLED: "true"
      GAME_AUTH_JWT_SECRET: "compose-dev-secret-change-me-32chars!"
      GAME_AUTH_JWT_TTL_SECONDS: "86400"
      GAME_AUTH_SESSION_STORE: jdbc
      GAME_AUTH_ENTITLEMENT_STORE: jdbc
      GAME_AUTH_JDBC_URL: jdbc:postgresql://postgres:5432/dungeon
      GAME_AUTH_JDBC_USERNAME: dm
      GAME_AUTH_JDBC_PASSWORD: dm-dev-password
      GAME_AUTH_JDBC_DRIVER: org.postgresql.Driver
      # Optional Redis (unused when store=jdbc; ready if you flip stores)
      GAME_AUTH_REDIS_URL: redis://redis:6379
      GAME_AUTH_REDIS_KEY_PREFIX: dm
      GAME_RATE_LIMIT_ENABLED: "true"
      GAME_RATE_LIMIT_STORE: redis
      GAME_INSTANCES_AUTOLOAD: "true"
      GAME_INSTANCES_SAVE_ON_EVICT: "true"
      GAME_CONTENT_PACKS_DIR: /data/packs
      GAME_AUTH_RECEIPT_LEDGER_STORE: redis
      GAME_CONTENT_SESSION_PACKS_STORE: redis
      GAME_MARKETPLACE_JOBS_STORE: redis
      GAME_ADMIN_TOKEN: "compose-dev-admin-token-change-me!!"
      GAME_CORS_ALLOWED_ORIGINS: "http://localhost:8080"
      GAME_LEGACY_API_ENABLED: "false"
    volumes:
      - saves:/data/saves
      - ../content-packs:/data/packs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app2:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      <<: *app_env
    volumes:
      - saves:/data/saves
      - ../content-packs:/data/packs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

volumes:
  pgdata:
  saves:
  packs:
