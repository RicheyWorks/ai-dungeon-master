# Optional metrics overlay: Prometheus scrapes app1/app2 /metrics.
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.metrics.yml \
#                  up --build -d
#
# UI: http://localhost:9090
# Targets: Status → Targets (dm-engines / app1 + app2)
#
# Combine with prod overlay if desired:
#   docker compose --env-file deploy/.env \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.prod.yml \
#     -f deploy/docker-compose.metrics.yml \
#     up -d

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    # Stay on the compose network so app1/app2 hostnames resolve
    restart: unless-stopped

volumes:
  prometheus_data:
