# Local / default Alertmanager config (UI only).
# For Slack + PagerDuty, copy the production template and inject secrets:
#
#   cp deploy/alertmanager/alertmanager.receivers.yml deploy/alertmanager/alertmanager.active.yml
#   # edit webhooks / routing keys (never commit real secrets)
#   # set ALERTMANAGER_CONFIG=alertmanager.active.yml in compose env
#
# UI: http://localhost:9093
# Templates: ./templates/*.tmpl

global:
  resolve_timeout: 5m
  # Optional Slack API URL for all slack_configs (overridden per-receiver):
  # slack_api_url: 'https://hooks.slack.com/services/XXX'

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: default
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: critical
      continue: true
    - matchers:
        - severity = warning
      receiver: warning
      continue: true

receivers:
  - name: default
    webhook_configs: []

  - name: warning
    webhook_configs: []

  - name: critical
    webhook_configs: []

inhibit_rules:
  - source_matchers:
      - alertname = DmEngineDown
    target_matchers:
      - alertname =~ "DmEngineNotReady|DmAuthDependencyDown"
    equal: [instance]
