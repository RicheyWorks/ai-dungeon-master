# Local Alertmanager config. Default route logs to the webhook receiver
# (blackhole). Point `webhook_configs` / `email_configs` / Slack at real sinks
# for production.
#
# UI: http://localhost:9093

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: critical
      continue: true

receivers:
  - name: default
    # No-op: alerts still appear in the Alertmanager UI / Prometheus Alerts page.
    webhook_configs: []

  - name: critical
    webhook_configs: []
    # Example Slack (uncomment + set secret):
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/XXX'
    #     channel: '#dm-alerts'
    #     title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}{{ .Annotations.summary }}
    #       {{ .Annotations.description }}{{ end }}

inhibit_rules:
  - source_matchers:
      - alertname = DmEngineDown
    target_matchers:
      - alertname =~ "DmEngineNotReady|DmAuthDependencyDown"
    equal: [instance]
