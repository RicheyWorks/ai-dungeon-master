openapi: 3.0.3
info:
  title: AI Dungeon Master API
  version: 2.0.0
  description: |
    HTTP API for the AI Dungeon Master engine.

    The **v2** API (`/v2/*`) wraps every response in a typed, versioned
    `Envelope` — `{ type, version, payload, requestId }` — so native clients get
    a stable, self-describing contract. The legacy `/api/game/*` endpoints remain
    for existing clients and are documented under the `legacy` tag.

    Public **health** probes (`/health`, `/health/ready`, `/v2/health`) need no auth
    for lean status. Session counts, dependency maps, and memory detail require
    `X-Metrics-Token` or `X-Admin-Token`. `GET /metrics` requires the scrape token
    when configured (always in production).
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: v2
    description: Versioned, envelope-wrapped API.
  - name: health
    description: Load-balancer liveness/readiness probes (no auth).
  - name: legacy
    description: Original unversioned API (kept for backward compatibility).
paths:

  /v2/admin/session-packs:
    get:
      tags: [admin]
      operationId: getAdminSessionPacks
      summary: Session pack overrides (ops)
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
        - in: header
          name: X-Admin-Token
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Enabled packs + overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionPacksEnvelope'
        '400':
          description: Missing sessionId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Admin API disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v2/admin/sessions:
    get:
      tags: [admin]
      operationId: listAdminSessions
      summary: List active sessions (ops)
      description: Identity only — no JWTs. Newest last-seen first.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 500 }
        - in: header
          name: X-Admin-Token
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Session inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionsEnvelope'
        '401':
          description: Invalid admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Admin API disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/admin/sessions/{sessionId}:
    delete:
      tags: [admin]
      operationId: revokeAdminSession
      summary: Revoke a session (ops)
      description: Deletes session identity and destroys its game engine (save-on-evict).
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
        - in: header
          name: X-Admin-Token
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionRevokedEnvelope'
        '401':
          description: Invalid admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Admin API disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v2/admin/sessions/purge-idle:
    post:
      tags: [admin]
      operationId: purgeIdleAdminSessions
      summary: Purge idle sessions (ops)
      description: Removes sessions idle longer than idleTtlSeconds; optionally runs engine idle eviction.
      parameters:
        - in: query
          name: idleTtlSeconds
          schema: { type: integer, format: int64, default: 86400 }
        - in: query
          name: evictEngines
          schema: { type: boolean, default: true }
        - in: header
          name: X-Admin-Token
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Purge result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionsPurgedEnvelope'
        '401':
          description: Invalid admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Admin API disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v2/admin/receipts:
    get:
      tags: [admin]
      operationId: listAdminReceipts
      summary: List recent redeemed receipts (ops)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 500 }
        - in: query
          name: productId
          schema: { type: string }
        - in: query
          name: storefront
          schema: { type: string }
        - in: query
          name: sessionId
          schema: { type: string }
        - in: query
          name: since
          description: Epoch milliseconds (inclusive lower bound)
          schema: { type: integer, format: int64 }
        - in: query
          name: until
          description: Epoch milliseconds (inclusive upper bound)
          schema: { type: integer, format: int64 }
        - in: header
          name: X-Admin-Token
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Recent receipt fingerprints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReceiptsEnvelope'
        '401':
          description: Bad admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Admin API disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/status:
    get:
      tags: [v2]
      operationId: getStatusV2
      summary: Current game status as a typed envelope.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Game status envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusEnvelope'
  /v2/action:
    post:
      tags: [v2]
      operationId: submitActionV2
      summary: Apply a choice; returns the updated game status envelope.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Updated game status envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusEnvelope'
        '400':
          description: Missing or unknown choice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/narrate:
    post:
      tags: [v2]
      operationId: narrateV2
      summary: Generate a dungeon-master narration via the active LLM provider.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NarrateRequest'
      responses:
        '200':
          description: Narration envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NarrativeEnvelope'
  /v2/save:
    post:
      tags: [v2]
      operationId: saveGameV2
      summary: Persist the caller's game engine to a session-scoped save file.
      description: |
        Authenticated callers save under `game.saves.dir/{sessionId}.json`.
        Unauthenticated callers share the process-default engine and save as
        `default.json`. Each authenticated session has its own engine instance.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Save acknowledgement envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSaveEnvelope'
  /v2/load:
    post:
      tags: [v2]
      operationId: loadGameV2
      summary: Restore the caller's game engine from its save file.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Restored game status envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusEnvelope'
        '400':
          description: No save file for this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/reset:
    post:
      tags: [v2]
      operationId: resetGameV2
      summary: Start a fresh engine for the caller (new party/quest).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Fresh game status envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusEnvelope'

  /v2/session:
    post:
      tags: [v2]
      operationId: createSessionV2
      summary: Mint a guest player session and JWT.
      description: |
        Public endpoint. Returns a session id plus a Bearer token used on all
        subsequent `/v2/*` calls (and as a STOMP CONNECT header for WebSocket).
        When multi-player isolation is enabled on the server, each session gets
        its own game engine.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: Session envelope including a fresh JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'

    delete:
      tags: [v2]
      operationId: deleteSessionV2
      summary: Explicit logout — drop session, pack prefs, and live engine.
      description: |
        Requires a valid Bearer token. Clears session identity, session-scoped
        pack overrides, and the live game engine. Clients should discard the
        token afterward.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Logout confirmation envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, example: session.logout }
                  version: { type: integer, example: 1 }
                  payload:
                    type: object
                    properties:
                      loggedOut: { type: boolean }
                      sessionId: { type: string }
                  requestId: { type: string }
        '401':
          description: Not authenticated.
        '429':
          description: Rate limited.

    patch:
      tags: [v2]
      operationId: renameSessionV2
      summary: Rename the session display name and re-issue JWT.
      description: |
        Requires a valid Bearer token. Updates the display name (max 64 chars)
        and returns a fresh JWT with the new name claim. Session id is unchanged.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: Session envelope with new name and JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '400':
          description: Missing displayName.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited.

  /v2/session/refresh:
    post:
      tags: [v2]
      operationId: refreshSessionV2
      summary: Re-issue a JWT for the current session (same session id).
      description: |
        Requires a valid Bearer token. Returns a new token with a fresh expiry
        while keeping the same session identity and game state. Prefer this over
        minting a new guest when the JWT is near expiry.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Session envelope with a fresh JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401':
          description: Not authenticated or session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited.
  /v2/session/me:
    get:
      tags: [v2]
      operationId: getSessionMeV2
      summary: Echo the authenticated session (no token reflected).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Session envelope (token field null).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/catalog:
    get:
      tags: [v2]
      operationId: getCatalogV2
      summary: Installed content packs and registered plugins (mod browser).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Catalog envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
  /v2/catalog/packs:
    post:
      tags: [v2]
      operationId: uploadPackV2
      summary: Upload and install a content-pack zip at runtime; returns the updated catalog.
      description: |
        Multipart zip install. In production, `game.catalog.upload.require-admin=true`
        so callers must send `X-Admin-Token` (current or previous during rotation).
        When `game.catalog.upload.enabled=false`, always **403**.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAdminToken'
        - name: replace
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Overwrite an already-installed pack with the same id.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    Pack zip — pack.yaml plus optional items/, monsters/,
                    strings/, quests/, campaigns/, npcs/, factions/. Pure data;
                    code-bearing mods use the plugin loader instead.
      responses:
        '201':
          description: Pack installed; updated catalog envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '200':
          description: Existing pack replaced; updated catalog envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '400':
          description: Invalid upload (bad zip, unsafe paths, missing/invalid pack.yaml, size limits).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Upload disabled or missing/invalid admin token when require-admin is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Pack id already installed and replace=false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/catalog/packs/{id}/enable:
    post:
      tags: [v2]
      operationId: enablePackV2
      summary: Enable a content pack; returns the updated catalog.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated catalog envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '404':
          description: Unknown content pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/catalog/packs/{id}/disable:
    post:
      tags: [v2]
      operationId: disablePackV2
      summary: Disable a content pack; returns the updated catalog.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated catalog envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '404':
          description: Unknown content pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/entitlements/verify:
    post:
      tags: [v2]
      operationId: verifyReceiptV2
      summary: Validate a purchase receipt via its storefront and grant the entitlement.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyReceiptRequest'
      responses:
        '200':
          description: Receipt valid; entitlement granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementEnvelope'
        '402':
          description: Receipt failed verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementEnvelope'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v2/marketplace:
    get:
      tags: [v2]
      operationId: listMarketplaceV2
      summary: List local marketplace content packs.
      description: |
        Discovers local packs under `game.content.packs.dir` plus optional remote index (`game.marketplace.remote-url`)
        with install/enabled status from the live catalog.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: q
          in: query
          schema: { type: string }
          description: Filter by id, name, or description
      responses:
        '200':
          description: Marketplace listing envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceEnvelope'
  /v2/marketplace/{id}:
    get:
      tags: [v2]
      operationId: getMarketplacePackV2
      summary: Marketplace pack detail.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pack detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplacePackEnvelope'
        '404':
          description: Unknown pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v2/marketplace/jobs/{jobId}:
    get:
      tags: [v2]
      operationId: getMarketplaceInstallJobV2
      summary: Poll async marketplace install progress.
      description: |
        Jobs are bound to the session that started them (`POST …/install?async=true`).
        Other sessions receive **403**. Legacy rows with no owner remain open.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Install job snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceInstallJobEnvelope'
        '403':
          description: Job belongs to another session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [v2]
      operationId: cancelMarketplaceInstallJobV2
      summary: Cancel an async marketplace install.
      description: |
        Same ownership ACL as poll — only the owning session may cancel.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job cancelled or already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceInstallJobEnvelope'
        '403':
          description: Job belongs to another session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/marketplace/{id}/install:
    post:
      tags: [v2]
      operationId: installMarketplacePackV2
      summary: Install a marketplace pack into the live catalog.
      description: |
        Sync by default. Pass `async=true` for background download with progress
        (`GET /v2/marketplace/jobs/{jobId}`). Async jobs bind to the caller session
        for poll/cancel ACL.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: async
          in: query
          schema: { type: boolean, default: false }
          description: When true, returns 202 + job id for progress polling.
      responses:
        '201':
          description: Newly installed (sync).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceInstallEnvelope'
        '200':
          description: Already installed (sync).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceInstallEnvelope'
        '202':
          description: Async install job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceInstallJobEnvelope'
        '404':
          description: Unknown pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/marketplace/{id}/install-async:
    post:
      tags: [v2]
      operationId: installMarketplacePackAsyncV2
      summary: Start an async marketplace pack install (always 202 + job).
      description: |
        Background download with progress polling via `GET /v2/marketplace/jobs/{jobId}`.
        Jobs bind to the caller session for poll/cancel ACL.
        Equivalent to `POST /v2/marketplace/{id}/install?async=true`.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Async install job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceInstallJobEnvelope'
        '400':
          description: Install rejected (validation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/entitlements/storefronts:
    get:
      tags: [v2]
      operationId: listStorefrontsV2
      summary: List registered storefronts and live/sandbox mode.
      responses:
        '200':
          description: Storefront inventory.
  /v2/entitlements:
    get:
      tags: [v2]
      operationId: listEntitlementsV2
      summary: List the caller's owned products.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Entitlements envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementEnvelope'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'


  /metrics:
    get:
      tags: [health]
      operationId: getPrometheusMetrics
      summary: Prometheus text exposition for scrapers.
      description: |
        Plaintext metrics (`text/plain`). When `game.metrics.scrape-token` is set
        (required in production), scrapers must send `X-Metrics-Token` or
        `Authorization: Bearer <token>`. Prefer private-network scrape.
      security: []
      parameters:
        - $ref: '#/components/parameters/XMetricsToken'
        - name: Authorization
          in: header
          required: false
          schema: { type: string }
          description: Bearer scrape token (alternative to X-Metrics-Token).
      responses:
        '200':
          description: Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Scrape token configured but missing/invalid.
          content:
            text/plain:
              schema:
                type: string
  /health:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe — process is accepting HTTP.
      description: |
        Always returns 200 while the JVM is up. Does **not** check JDBC/Redis.
        Use `/health/ready` for dependency-aware readiness. Always lean (no recon fields).
      security: []
      responses:
        '200':
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe — configured auth backends reachable.
      description: |
        Probes JDBC, Redis, and/or file stores only when selected via
        `game.auth.*.store`. Returns **503** when a required dependency is DOWN.
        Public responses are lean (`status` + `probe`). Session/engine counts and
        the dependency map require `X-Metrics-Token` or `X-Admin-Token`.
      security: []
      parameters:
        - $ref: '#/components/parameters/XMetricsToken'
        - $ref: '#/components/parameters/XAdminToken'
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: A required auth-store dependency is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /ready:
    get:
      tags: [health]
      operationId: getReadinessAlias
      summary: Alias for `/health/ready`.
      security: []
      parameters:
        - $ref: '#/components/parameters/XMetricsToken'
        - $ref: '#/components/parameters/XAdminToken'
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /v2/health:
    get:
      tags: [v2]
      operationId: getHealthV2
      summary: Health envelope (lean public; detail with ops token).
      description: |
        Versioned envelope. Unauthenticated callers get `status`, `uptimeSeconds`,
        and `detail: false`. With `X-Metrics-Token` or `X-Admin-Token`, includes
        sessions, engines, dependencies, memory, and `detail: true`.
        Excluded from JWT enforcement.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XMetricsToken'
        - $ref: '#/components/parameters/XAdminToken'
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          description: Dependency down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /api/game/status:
    get:
      tags: [legacy]
      operationId: getStatusLegacy
      summary: Legacy game status (flat pipe-delimited party summary string).
      responses:
        '200':
          description: Game status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusResponse'
  /api/game/choices:
    get:
      tags: [legacy]
      operationId: getChoicesLegacy
      summary: Available choice labels.
      responses:
        '200':
          description: Choice labels.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/game/action:
    post:
      tags: [legacy]
      operationId: submitActionLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Acceptance message.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Missing or unknown choice.
          content:
            text/plain:
              schema:
                type: string
  /api/game/start:
    post:
      tags: [legacy]
      operationId: startQuestLegacy
      summary: (Re)start the quest and return the opening banner.
      responses:
        '200':
          description: Opening banner text.
          content:
            text/plain:
              schema:
                type: string
  /api/game/save:
    post:
      tags: [legacy]
      operationId: saveGameLegacy
      responses:
        '200':
          description: Confirmation message.
          content:
            text/plain:
              schema:
                type: string
  /api/game/load:
    post:
      tags: [legacy]
      operationId: loadGameLegacy
      responses:
        '200':
          description: Confirmation message.
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >
        Optional correlation id echoed back in the response envelope's
        requestId. A server-generated UUID is used when omitted.
      schema:
        type: string
    XAdminToken:
      name: X-Admin-Token
      in: header
      required: false
      description: >
        Ops shared secret (`game.admin.token`). During rotation,
        `game.admin.token.previous` is also accepted. Required for admin routes
        and (in prod) catalog pack upload; unlocks health recon detail.
      schema:
        type: string
    XMetricsToken:
      name: X-Metrics-Token
      in: header
      required: false
      description: >
        Metrics scrape token (`game.metrics.scrape-token`). Alternative to
        `Authorization: Bearer <token>`. Unlocks readiness/v2 health detail fields.
      schema:
        type: string
  schemas:

    LivenessResponse:
      type: object
      required: [status, probe]
      properties:
        status:
          type: string
          enum: [UP]
        probe:
          type: string
          enum: [liveness]
    DependencyCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, NOT_CONFIGURED]
        detail:
          type: string
    ReadinessResponse:
      type: object
      required: [status, probe]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        probe:
          type: string
          enum: [readiness]
        sessions:
          type: integer
          description: Present only with metrics/admin token.
        engines:
          type: integer
          description: Present only with metrics/admin token.
        dependencies:
          type: object
          description: Present only with metrics/admin token.
          additionalProperties:
            $ref: '#/components/schemas/DependencyCheck'
    HealthPayload:
      type: object
      required: [status, detail]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        uptimeSeconds:
          type: integer
          format: int64
        detail:
          type: boolean
          description: >
            false for unauthenticated lean responses; true when sessions/engines/
            dependencies/memory are included.
        sessions:
          type: integer
        engines:
          type: integer
        dependencies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyCheck'
        memory:
          type: object
          properties:
            maxBytes:
              type: integer
              format: int64
            totalBytes:
              type: integer
              format: int64
            freeBytes:
              type: integer
              format: int64
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              enum: [health]
            payload:
              $ref: '#/components/schemas/HealthPayload'


    AdminReceiptRow:
      type: object
      properties:
        fingerprint: { type: string }
        sessionId: { type: string }
        productId: { type: string }
        storefront: { type: string }
        redeemedAtEpochMs: { type: integer, format: int64 }
    AdminReceiptsPayload:
      type: object
      properties:
        count: { type: integer }
        limit: { type: integer }
        productId: { type: string }
        storefront: { type: string }
        sessionId: { type: string }
        since: { type: integer, format: int64 }
        until: { type: integer, format: int64 }
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/AdminReceiptRow'
    AdminReceiptsEnvelope:
      type: object
      required: [type, version, payload, requestId]
      properties:
        type: { type: string, example: admin.receipts }
        version: { type: integer }
        payload:
          $ref: '#/components/schemas/AdminReceiptsPayload'
        requestId: { type: string }
    AdminSessionPacksPayload:
      type: object
      properties:
        sessionId: { type: string }
        enabledPackIds:
          type: array
          items: { type: string }
        overrides:
          type: object
          additionalProperties: true
        sessionScoped: { type: boolean }
    AdminSessionPacksEnvelope:
      type: object
      required: [type, version, payload, requestId]
      properties:
        type: { type: string, example: admin.session-packs }
        version: { type: integer }
        payload:
          $ref: '#/components/schemas/AdminSessionPacksPayload'
        requestId: { type: string }
    AdminSessionsPurgedPayload:
      type: object
      properties:
        idleTtlSeconds: { type: integer, format: int64 }
        removedSessions: { type: integer }
        removedEngines: { type: integer }
        activeSessions: { type: integer }
        activeEngines: { type: integer }
    AdminSessionsPurgedEnvelope:
      type: object
      required: [type, version, payload, requestId]
      properties:
        type: { type: string, example: admin.sessions.purged }
        version: { type: integer }
        payload:
          $ref: '#/components/schemas/AdminSessionsPurgedPayload'
        requestId: { type: string }

    AdminSessionRow:
      type: object
      properties:
        sessionId: { type: string }
        displayName: { type: string }
        createdAtEpochSeconds: { type: integer, format: int64 }
        lastSeenEpochSeconds: { type: integer, format: int64 }
        hasEngine: { type: boolean }
    AdminSessionsPayload:
      type: object
      properties:
        count: { type: integer }
        total: { type: integer }
        limit: { type: integer }
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AdminSessionRow'
    AdminSessionsEnvelope:
      type: object
      required: [type, version, payload, requestId]
      properties:
        type: { type: string, example: admin.sessions }
        version: { type: integer, example: 1 }
        payload:
          $ref: '#/components/schemas/AdminSessionsPayload'
        requestId: { type: string }
    AdminSessionRevokedPayload:
      type: object
      properties:
        sessionId: { type: string }
        revoked: { type: boolean }
        existed: { type: boolean }
    AdminSessionRevokedEnvelope:
      type: object
      required: [type, version, payload, requestId]
      properties:
        type: { type: string, example: admin.session.revoked }
        version: { type: integer, example: 1 }
        payload:
          $ref: '#/components/schemas/AdminSessionRevokedPayload'
        requestId: { type: string }

    MarketplaceListing:
      type: object
      required: [id, displayName, version, installed, enabled, source]
      properties:
        id: { type: string }
        displayName: { type: string }
        version: { type: string }
        minEngineVersion: { type: string }
        description: { type: string }
        installed: { type: boolean }
        enabled: { type: boolean }
        sourcePath: { type: string, nullable: true }
        source:
          type: string
          enum: [local, remote]
        downloadUrl: { type: string, nullable: true }
        sha256: { type: string, nullable: true }
    MarketplacePayload:
      type: object
      properties:
        root: { type: string }
        remoteIndexUrl: { type: string, nullable: true }
        remoteOk: { type: boolean }
        remoteError: { type: string, nullable: true }
        available: { type: integer }
        installed: { type: integer }
        packs:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceListing'
    MarketplaceEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              enum: [marketplace]
            payload:
              $ref: '#/components/schemas/MarketplacePayload'
    MarketplacePackEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              enum: [marketplace_pack]
            payload:
              $ref: '#/components/schemas/MarketplaceListing'
    MarketplaceInstallJob:
      type: object
      required: [jobId, packId, phase, percent]
      properties:
        jobId: { type: string }
        packId: { type: string }
        phase:
          type: string
          enum: [QUEUED, DOWNLOADING, VERIFYING, INSTALLING, DONE, FAILED, CANCELLED]
        bytesRead: { type: integer, format: int64 }
        bytesTotal: { type: integer, format: int64 }
        percent: { type: integer }
        message: { type: string, nullable: true }
        cancelRequested: { type: boolean }
        error: { type: string, nullable: true }
    MarketplaceInstallJobEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              enum: [marketplace_install_job]
            payload:
              $ref: '#/components/schemas/MarketplaceInstallJob'
    MarketplaceInstallResult:
      type: object
      properties:
        packId: { type: string }
        alreadyInstalled: { type: boolean }
        message: { type: string }
        marketplace:
          $ref: '#/components/schemas/MarketplacePayload'
    MarketplaceInstallEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              enum: [marketplace_install]
            payload:
              $ref: '#/components/schemas/MarketplaceInstallResult'
    Envelope:
      type: object
      description: Base transport envelope. Concrete responses specialize `payload`.
      required: [type, version, payload, requestId]
      properties:
        type:
          type: string
          description: Payload discriminator (game_status, narrative_update, error).
        version:
          type: integer
          description: Schema version of the payload contract.
          example: 1
        payload:
          type: object
          description: Typed body; shape depends on `type`.
        requestId:
          type: string
          description: Correlation id (echoed from X-Request-Id or generated).
    GameStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: game_status
            payload:
              $ref: '#/components/schemas/GameStatusV2'
    NarrativeEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: narrative_update
            payload:
              $ref: '#/components/schemas/NarrativePayload'
    GameSaveEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: game_save
            payload:
              type: object
              properties:
                saved: { type: boolean }
                path: { type: string }
                sessionScoped: { type: boolean }

    SessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: session
            payload:
              $ref: '#/components/schemas/SessionPayload'
    SessionRequest:
      type: object
      properties:
        displayName:
          type: string
          description: Optional guest display name.
          example: Kael
    SessionPayload:
      type: object
      required: [sessionId, displayName]
      properties:
        sessionId:
          type: string
          description: Stable player session id (JWT subject).
        token:
          type: string
          description: JWT (only set on create; null on /session/me).
          nullable: true
        displayName:
          type: string
        expiresAtEpochSeconds:
          type: integer
          format: int64
        createdAtEpochSeconds:
          type: integer
          format: int64
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: error
            payload:
              $ref: '#/components/schemas/ErrorPayload'
    CatalogEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: catalog
            payload:
              $ref: '#/components/schemas/CatalogPayload'
    EntitlementEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: entitlement
            payload:
              $ref: '#/components/schemas/EntitlementPayload'
    MemberState:
      type: object
      description: Public snapshot of a single party member.
      properties:
        name: { type: string }
        role: { type: string }
        level: { type: integer }
        hp: { type: integer }
        maxHp: { type: integer }
        mana: { type: integer }
        maxMana: { type: integer }
        armorClass: { type: integer }
        alive: { type: boolean }
        ascendant: { type: boolean }
        statuses:
          type: array
          items: { type: string }
    GameStatusV2:
      type: object
      properties:
        party:
          type: array
          items:
            $ref: '#/components/schemas/MemberState'
        chaosLevel: { type: integer }
        combatActive: { type: boolean }
        availableChoices:
          type: array
          items: { type: string }
        recentHistory:
          type: array
          items: { type: string }
        quest:
          $ref: '#/components/schemas/QuestInfo'
        recentEvents:
          description: >-
            Compact story-memory facts from the engine's Chronicle (newest
            last), e.g. "Quest completed: The Weeping Tree". Bounded server-side.
          type: array
          items: { type: string }
        location:
          description: Current party location from the engine WorldMap.
          type: string
        discoveredRifts:
          description: Named rifts the party has discovered (starting set + completed quests).
          type: array
          items: { type: string }
    QuestInfo:
      description: Outcome snapshot of the current quest.
      type: object
      nullable: true
      properties:
        title: { type: string }
        completed: { type: boolean }
        failed: { type: boolean }
        progress:
          description: Scene progress in [0,1].
          type: number
          format: double
    NarrativePayload:
      type: object
      properties:
        text: { type: string }
        provider:
          type: string
          description: Active provider id, e.g. local-stub.
        tokensUsed: { type: integer }
        fallback:
          type: boolean
          description: True when a guardrail/fallback response was returned.
    CatalogPayload:
      type: object
      description: Snapshot of everything installed and dispatchable in the engine.
      properties:
        contentPacks:
          type: array
          items:
            $ref: '#/components/schemas/PackInfo'
        plugins:
          $ref: '#/components/schemas/PluginSummary'
        narration:
          $ref: '#/components/schemas/NarrationInfo'
    PackInfo:
      type: object
      description: One installed content pack.
      properties:
        id: { type: string }
        displayName: { type: string }
        version: { type: string }
        monsters: { type: integer }
        items: { type: integer }
        enabled: { type: boolean }
        requiredProductIds:
          type: array
          items: { type: string }
          description: Store SKUs required to enable this pack.
        locked:
          type: boolean
          description: True when the caller cannot enable the pack (missing entitlement).
    PluginSummary:
      type: object
      description: Registered plugin ids (or biome tags) grouped by SPI.
      properties:
        spellEffects: { type: array, items: { type: string } }
        itemEffects: { type: array, items: { type: string } }
        encounterBiomes: { type: array, items: { type: string } }
        lootBiomes: { type: array, items: { type: string } }
        questScripts: { type: array, items: { type: string } }
        storefronts: { type: array, items: { type: string } }
        llmProviders: { type: array, items: { type: string } }
    NarrationInfo:
      type: object
      description: Active narration provider and everything available to switch to.
      properties:
        active: { type: string }
        health:
          type: string
          description: Provider health (OK, DEGRADED, DOWN, UNKNOWN).
        available:
          type: array
          items: { type: string }
    EntitlementPayload:
      type: object
      properties:
        granted: { type: boolean }
        productId: { type: string, nullable: true }
        storefront: { type: string, nullable: true }
        reason: { type: string }
        owned:
          type: array
          items: { type: string }
        enabledPacks:
          type: array
          items: { type: string }
          description: Content packs auto-enabled because required SKUs are now owned.
    VerifyReceiptRequest:
      type: object
      required: [productId, receipt]
      properties:
        storefront: { type: string, example: dev }
        productId: { type: string, example: sku_gold }
        receipt: { type: string }
    ErrorPayload:
      type: object
      properties:
        message: { type: string }
    ActionRequest:
      type: object
      required: [choiceLabel]
      properties:
        choiceLabel:
          type: string
          example: Attack
    NarrateRequest:
      type: object
      properties:
        prompt:
          type: string
          example: I search the altar for traps
    GameStatusResponse:
      type: object
      description: Legacy flat status; `partySummary` is a pipe-delimited string.
      properties:
        partySummary: { type: string }
        chaosLevel: { type: integer }
        combatActive: { type: boolean }
        availableChoices:
          type: array
          items: { type: string }
        recentHistory:
          type: array
          items: { type: string }
