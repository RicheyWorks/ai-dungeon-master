openapi: 3.0.3
info:
  title: AI Dungeon Master API
  version: 2.0.0
  description: |
    HTTP API for the AI Dungeon Master engine.

    The **v2** API (`/v2/*`) wraps every response in a typed, versioned
    `Envelope` — `{ type, version, payload, requestId }` — so native clients get
    a stable, self-describing contract. The legacy `/api/game/*` endpoints remain
    for existing clients and are documented under the `legacy` tag.

    Public **health** probes (`/health`, `/health/ready`, `/v2/health`) need no auth.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: v2
    description: Versioned, envelope-wrapped API.
  - name: health
    description: Load-balancer liveness/readiness probes (no auth).
  - name: legacy
    description: Original unversioned API (kept for backward compatibility).
paths:

  /v2/admin/session-packs:
    get:
      tags: [admin]
      summary: Session pack overrides (ops)
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
        - in: header
          name: X-Admin-Token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Enabled packs + overrides }

  /v2/admin/receipts:
    get:
      tags: [admin]
      summary: List recent redeemed receipts (ops)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 500 }
        - in: query
          name: productId
          schema: { type: string }
        - in: query
          name: storefront
          schema: { type: string }
        - in: query
          name: sessionId
          schema: { type: string }
        - in: query
          name: since
          description: Epoch milliseconds (inclusive lower bound)
          schema: { type: integer, format: int64 }
        - in: query
          name: until
          description: Epoch milliseconds (inclusive upper bound)
          schema: { type: integer, format: int64 }
        - in: header
          name: X-Admin-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Recent receipt fingerprints
        '401':
          description: Bad admin token
        '404':
          description: Admin API disabled
  /v2/status:
    get:
      tags: [v2]
      operationId: getStatusV2
      summary: Current game status as a typed envelope.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Game status envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusEnvelope'
  /v2/action:
    post:
      tags: [v2]
      operationId: submitActionV2
      summary: Apply a choice; returns the updated game status envelope.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Updated game status envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusEnvelope'
        '400':
          description: Missing or unknown choice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/narrate:
    post:
      tags: [v2]
      operationId: narrateV2
      summary: Generate a dungeon-master narration via the active LLM provider.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NarrateRequest'
      responses:
        '200':
          description: Narration envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NarrativeEnvelope'
  /v2/save:
    post:
      tags: [v2]
      operationId: saveGameV2
      summary: Persist the caller's game engine to a session-scoped save file.
      description: |
        Authenticated callers save under `game.saves.dir/{sessionId}.json`.
        Unauthenticated callers share the process-default engine and save as
        `default.json`. Each authenticated session has its own engine instance.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Save acknowledgement envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSaveEnvelope'
  /v2/load:
    post:
      tags: [v2]
      operationId: loadGameV2
      summary: Restore the caller's game engine from its save file.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Restored game status envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusEnvelope'
        '400':
          description: No save file for this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/reset:
    post:
      tags: [v2]
      operationId: resetGameV2
      summary: Start a fresh engine for the caller (new party/quest).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Fresh game status envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusEnvelope'

  /v2/session:
    post:
      tags: [v2]
      operationId: createSessionV2
      summary: Mint a guest player session and JWT.
      description: |
        Public endpoint. Returns a session id plus a Bearer token used on all
        subsequent `/v2/*` calls (and as a STOMP CONNECT header for WebSocket).
        When multi-player isolation is enabled on the server, each session gets
        its own game engine.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: Session envelope including a fresh JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
  /v2/session/me:
    get:
      tags: [v2]
      operationId: getSessionMeV2
      summary: Echo the authenticated session (no token reflected).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Session envelope (token field null).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/catalog:
    get:
      tags: [v2]
      operationId: getCatalogV2
      summary: Installed content packs and registered plugins (mod browser).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Catalog envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
  /v2/catalog/packs:
    post:
      tags: [v2]
      operationId: uploadPackV2
      summary: Upload and install a content-pack zip at runtime; returns the updated catalog.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: replace
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Overwrite an already-installed pack with the same id.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    Pack zip — pack.yaml plus optional items/, monsters/,
                    strings/, quests/, campaigns/, npcs/, factions/. Pure data;
                    code-bearing mods use the plugin loader instead.
      responses:
        '201':
          description: Pack installed; updated catalog envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '200':
          description: Existing pack replaced; updated catalog envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '400':
          description: Invalid upload (bad zip, unsafe paths, missing/invalid pack.yaml, size limits).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Pack id already installed and replace=false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/catalog/packs/{id}/enable:
    post:
      tags: [v2]
      operationId: enablePackV2
      summary: Enable a content pack; returns the updated catalog.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated catalog envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '404':
          description: Unknown content pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/catalog/packs/{id}/disable:
    post:
      tags: [v2]
      operationId: disablePackV2
      summary: Disable a content pack; returns the updated catalog.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated catalog envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '404':
          description: Unknown content pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v2/entitlements/verify:
    post:
      tags: [v2]
      operationId: verifyReceiptV2
      summary: Validate a purchase receipt via its storefront and grant the entitlement.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyReceiptRequest'
      responses:
        '200':
          description: Receipt valid; entitlement granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementEnvelope'
        '402':
          description: Receipt failed verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementEnvelope'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v2/marketplace:
    get:
      tags: [v2]
      operationId: listMarketplaceV2
      summary: List local marketplace content packs.
      description: |
        Discovers local packs under `game.content.packs.dir` plus optional remote index (`game.marketplace.remote-url`)
        with install/enabled status from the live catalog.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: q
          in: query
          schema: { type: string }
          description: Filter by id, name, or description
      responses:
        '200':
          description: Marketplace listing envelope.
  /v2/marketplace/{id}:
    get:
      tags: [v2]
      operationId: getMarketplacePackV2
      summary: Marketplace pack detail.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pack detail.
        '404':
          description: Unknown pack.

  /v2/marketplace/jobs/{jobId}:
    get:
      tags: [v2]
      operationId: getMarketplaceInstallJobV2
      summary: Poll async marketplace install progress.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Install job snapshot.
        '404':
          description: Unknown job.
    delete:
      tags: [v2]
      operationId: cancelMarketplaceInstallJobV2
      summary: Cancel an async marketplace install.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job cancelled or already terminal.
        '404':
          description: Unknown job.
  /v2/marketplace/{id}/install:
    post:
      tags: [v2]
      operationId: installMarketplacePackV2
      summary: Install a marketplace pack into the live catalog.
      description: |
        Sync by default. Pass `async=true` for background download with progress
        (`GET /v2/marketplace/jobs/{jobId}`).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: async
          in: query
          schema: { type: boolean, default: false }
          description: When true, returns 202 + job id for progress polling.
      responses:
        '201':
          description: Newly installed.
        '200':
          description: Already installed.
        '202':
          description: Async install job accepted.
        '404':
          description: Unknown pack.
  /v2/entitlements/storefronts:
    get:
      tags: [v2]
      operationId: listStorefrontsV2
      summary: List registered storefronts and live/sandbox mode.
      responses:
        '200':
          description: Storefront inventory.
  /v2/entitlements:
    get:
      tags: [v2]
      operationId: listEntitlementsV2
      summary: List the caller's owned products.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Entitlements envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementEnvelope'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'


  /metrics:
    get:
      tags: [health]
      operationId: getPrometheusMetrics
      summary: Prometheus text exposition for scrapers.
      description: |
        Public plaintext metrics (`text/plain`). Prefer private network scrape.
      security: []
      responses:
        '200':
          description: Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string
  /health:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe — process is accepting HTTP.
      description: |
        Always returns 200 while the JVM is up. Does **not** check JDBC/Redis.
        Use `/health/ready` for dependency-aware readiness.
      security: []
      responses:
        '200':
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe — configured auth backends reachable.
      description: |
        Probes JDBC, Redis, and/or file stores only when selected via
        `game.auth.*.store`. Returns **503** when a required dependency is DOWN.
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: A required auth-store dependency is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /ready:
    get:
      tags: [health]
      operationId: getReadinessAlias
      summary: Alias for `/health/ready`.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /v2/health:
    get:
      tags: [v2]
      operationId: getHealthV2
      summary: Health metrics envelope (public, no auth).
      description: |
        Versioned envelope with uptime, session/engine counts, memory, and the
        same dependency map as `/health/ready`. Excluded from JWT enforcement.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          description: Dependency down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /api/game/status:
    get:
      tags: [legacy]
      operationId: getStatusLegacy
      summary: Legacy game status (flat pipe-delimited party summary string).
      responses:
        '200':
          description: Game status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusResponse'
  /api/game/choices:
    get:
      tags: [legacy]
      operationId: getChoicesLegacy
      summary: Available choice labels.
      responses:
        '200':
          description: Choice labels.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/game/action:
    post:
      tags: [legacy]
      operationId: submitActionLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Acceptance message.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Missing or unknown choice.
          content:
            text/plain:
              schema:
                type: string
  /api/game/start:
    post:
      tags: [legacy]
      operationId: startQuestLegacy
      summary: (Re)start the quest and return the opening banner.
      responses:
        '200':
          description: Opening banner text.
          content:
            text/plain:
              schema:
                type: string
  /api/game/save:
    post:
      tags: [legacy]
      operationId: saveGameLegacy
      responses:
        '200':
          description: Confirmation message.
          content:
            text/plain:
              schema:
                type: string
  /api/game/load:
    post:
      tags: [legacy]
      operationId: loadGameLegacy
      responses:
        '200':
          description: Confirmation message.
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >
        Optional correlation id echoed back in the response envelope's
        requestId. A server-generated UUID is used when omitted.
      schema:
        type: string
  schemas:

    LivenessResponse:
      type: object
      required: [status, probe]
      properties:
        status:
          type: string
          enum: [UP]
        probe:
          type: string
          enum: [liveness]
    DependencyCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, NOT_CONFIGURED]
        detail:
          type: string
    ReadinessResponse:
      type: object
      required: [status, probe]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        probe:
          type: string
          enum: [readiness]
        sessions:
          type: integer
        engines:
          type: integer
        dependencies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyCheck'
    HealthPayload:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        uptimeSeconds:
          type: integer
          format: int64
        sessions:
          type: integer
        engines:
          type: integer
        dependencies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyCheck'
        memory:
          type: object
          properties:
            maxBytes:
              type: integer
              format: int64
            totalBytes:
              type: integer
              format: int64
            freeBytes:
              type: integer
              format: int64
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              enum: [health]
            payload:
              $ref: '#/components/schemas/HealthPayload'
    Envelope:
      type: object
      description: Base transport envelope. Concrete responses specialize `payload`.
      required: [type, version, payload, requestId]
      properties:
        type:
          type: string
          description: Payload discriminator (game_status, narrative_update, error).
        version:
          type: integer
          description: Schema version of the payload contract.
          example: 1
        payload:
          type: object
          description: Typed body; shape depends on `type`.
        requestId:
          type: string
          description: Correlation id (echoed from X-Request-Id or generated).
    GameStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: game_status
            payload:
              $ref: '#/components/schemas/GameStatusV2'
    NarrativeEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: narrative_update
            payload:
              $ref: '#/components/schemas/NarrativePayload'
    GameSaveEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: game_save
            payload:
              type: object
              properties:
                saved: { type: boolean }
                path: { type: string }
                sessionScoped: { type: boolean }

    SessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: session
            payload:
              $ref: '#/components/schemas/SessionPayload'
    SessionRequest:
      type: object
      properties:
        displayName:
          type: string
          description: Optional guest display name.
          example: Kael
    SessionPayload:
      type: object
      required: [sessionId, displayName]
      properties:
        sessionId:
          type: string
          description: Stable player session id (JWT subject).
        token:
          type: string
          description: JWT (only set on create; null on /session/me).
          nullable: true
        displayName:
          type: string
        expiresAtEpochSeconds:
          type: integer
          format: int64
        createdAtEpochSeconds:
          type: integer
          format: int64
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: error
            payload:
              $ref: '#/components/schemas/ErrorPayload'
    CatalogEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: catalog
            payload:
              $ref: '#/components/schemas/CatalogPayload'
    EntitlementEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              type: string
              example: entitlement
            payload:
              $ref: '#/components/schemas/EntitlementPayload'
    MemberState:
      type: object
      description: Public snapshot of a single party member.
      properties:
        name: { type: string }
        role: { type: string }
        level: { type: integer }
        hp: { type: integer }
        maxHp: { type: integer }
        mana: { type: integer }
        maxMana: { type: integer }
        armorClass: { type: integer }
        alive: { type: boolean }
        ascendant: { type: boolean }
        statuses:
          type: array
          items: { type: string }
    GameStatusV2:
      type: object
      properties:
        party:
          type: array
          items:
            $ref: '#/components/schemas/MemberState'
        chaosLevel: { type: integer }
        combatActive: { type: boolean }
        availableChoices:
          type: array
          items: { type: string }
        recentHistory:
          type: array
          items: { type: string }
        quest:
          $ref: '#/components/schemas/QuestInfo'
        recentEvents:
          description: >-
            Compact story-memory facts from the engine's Chronicle (newest
            last), e.g. "Quest completed: The Weeping Tree". Bounded server-side.
          type: array
          items: { type: string }
        location:
          description: Current party location from the engine WorldMap.
          type: string
        discoveredRifts:
          description: Named rifts the party has discovered (starting set + completed quests).
          type: array
          items: { type: string }
    QuestInfo:
      description: Outcome snapshot of the current quest.
      type: object
      nullable: true
      properties:
        title: { type: string }
        completed: { type: boolean }
        failed: { type: boolean }
        progress:
          description: Scene progress in [0,1].
          type: number
          format: double
    NarrativePayload:
      type: object
      properties:
        text: { type: string }
        provider:
          type: string
          description: Active provider id, e.g. local-stub.
        tokensUsed: { type: integer }
        fallback:
          type: boolean
          description: True when a guardrail/fallback response was returned.
    CatalogPayload:
      type: object
      description: Snapshot of everything installed and dispatchable in the engine.
      properties:
        contentPacks:
          type: array
          items:
            $ref: '#/components/schemas/PackInfo'
        plugins:
          $ref: '#/components/schemas/PluginSummary'
        narration:
          $ref: '#/components/schemas/NarrationInfo'
    PackInfo:
      type: object
      description: One installed content pack.
      properties:
        id: { type: string }
        displayName: { type: string }
        version: { type: string }
        monsters: { type: integer }
        items: { type: integer }
        enabled: { type: boolean }
        requiredProductIds:
          type: array
          items: { type: string }
          description: Store SKUs required to enable this pack.
        locked:
          type: boolean
          description: True when the caller cannot enable the pack (missing entitlement).
    PluginSummary:
      type: object
      description: Registered plugin ids (or biome tags) grouped by SPI.
      properties:
        spellEffects: { type: array, items: { type: string } }
        itemEffects: { type: array, items: { type: string } }
        encounterBiomes: { type: array, items: { type: string } }
        lootBiomes: { type: array, items: { type: string } }
        questScripts: { type: array, items: { type: string } }
        storefronts: { type: array, items: { type: string } }
        llmProviders: { type: array, items: { type: string } }
    NarrationInfo:
      type: object
      description: Active narration provider and everything available to switch to.
      properties:
        active: { type: string }
        health:
          type: string
          description: Provider health (OK, DEGRADED, DOWN, UNKNOWN).
        available:
          type: array
          items: { type: string }
    EntitlementPayload:
      type: object
      properties:
        granted: { type: boolean }
        productId: { type: string, nullable: true }
        storefront: { type: string, nullable: true }
        reason: { type: string }
        owned:
          type: array
          items: { type: string }
        enabledPacks:
          type: array
          items: { type: string }
          description: Content packs auto-enabled because required SKUs are now owned.
    VerifyReceiptRequest:
      type: object
      required: [productId, receipt]
      properties:
        storefront: { type: string, example: dev }
        productId: { type: string, example: sku_gold }
        receipt: { type: string }
    ErrorPayload:
      type: object
      properties:
        message: { type: string }
    ActionRequest:
      type: object
      required: [choiceLabel]
      properties:
        choiceLabel:
          type: string
          example: Attack
    NarrateRequest:
      type: object
      properties:
        prompt:
          type: string
          example: I search the altar for traps
    GameStatusResponse:
      type: object
      description: Legacy flat status; `partySummary` is a pipe-delimited string.
      properties:
        partySummary: { type: string }
        chaosLevel: { type: integer }
        combatActive: { type: boolean }
        availableChoices:
          type: array
          items: { type: string }
        recentHistory:
          type: array
          items: { type: string }
