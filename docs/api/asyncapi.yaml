asyncapi: '2.6.0'
info:
  title: AI Dungeon Master WebSocket API
  version: 2.1.0
  description: |
    STOMP-over-WebSocket messaging for the AI Dungeon Master engine.

    Clients connect to the STOMP endpoint `/ws` (SockJS fallback available).

    **Multi-player isolation:** pass `Authorization: Bearer <jwt>` (from
    `POST /v2/session`) as a STOMP CONNECT native header. The server binds the
    connection to that player session. Then:
      - subscribe to `/topic/narrative/{sessionId}` for your world only
      - SEND actions to `/app/action` and narration requests to `/app/narrate`

    When `game.auth.enabled=true` (production):
      - CONNECT without a valid JWT is rejected
      - SUBSCRIBE to another session's topic is denied
      - shared `/topic/narrative` is disabled

    Unauthenticated connections (auth off / local dev) keep the legacy single-player path:
      - subscribe to `/topic/narrative`
      - share the process-default engine

    The narrative stream carries plain-text messages (engine broadcasts and
    `[WS]` acks) plus typed v2 envelopes (`narrative_chunk` /
    `narrative_update`) for streaming narration.
defaultContentType: application/json
servers:
  local:
    url: localhost:8080
    protocol: ws
    description: >
      STOMP broker over WebSocket. Native endpoint ws://localhost:8080/ws;
      SockJS fallback at http://localhost:8080/ws. In-memory simple broker for
      /topic/** destinations; application destinations are prefixed /app.
channels:
  /topic/narrative:
    description: >
      Legacy global narration stream (unauthenticated / default engine).
    subscribe:
      operationId: receiveNarrative
      summary: Receive narration plus combat and flavor events.
      message:
        oneOf:
          - $ref: '#/components/messages/NarrativeText'
          - $ref: '#/components/messages/NarrativeChunk'
          - $ref: '#/components/messages/NarrativeEnvelope'
  /topic/narrative/{sessionId}:
    description: >
      Session-scoped narration stream for an authenticated player. Subscribe
      after CONNECT with a Bearer JWT whose `sub` is `{sessionId}`.
    parameters:
      sessionId:
        description: Player session id (JWT subject).
        schema:
          type: string
    subscribe:
      operationId: receiveSessionNarrative
      summary: Receive narration for one isolated game world.
      message:
        oneOf:
          - $ref: '#/components/messages/NarrativeText'
          - $ref: '#/components/messages/NarrativeChunk'
          - $ref: '#/components/messages/NarrativeEnvelope'
  /app/action:
    description: >
      Player action commands routed to the caller's engine (STOMP SEND).
      Uses the session bound on CONNECT when present.
    publish:
      operationId: sendAction
      summary: Send a choice for the engine to process.
      message:
        $ref: '#/components/messages/ActionCommand'
  /app/narrate:
    description: >
      Request streaming DM narration for the caller's engine (STOMP SEND).
    publish:
      operationId: sendNarrate
      summary: Stream a narration for a player prompt.
      message:
        $ref: '#/components/messages/NarrateCommand'
components:
  messages:
    NarrativeText:
      name: narrativeText
      title: Plain-text narration (current wire format)
      contentType: text/plain
      summary: A raw narration line or a "[WS]" acknowledgement string.
      payload:
        type: string
        example: "Kael strikes the Rift Hound for 12 damage."
    NarrativeEnvelope:
      name: narrativeEnvelope
      title: Typed narration envelope (v2 target)
      contentType: application/json
      summary: v2 envelope, identical in shape to the REST /v2/narrate response.
      payload:
        $ref: '#/components/schemas/NarrativeEnvelopePayload'
    NarrativeChunk:
      name: narrativeChunk
      title: Streamed narration chunk (v2)
      contentType: application/json
      summary: A partial narration chunk pushed during streaming.
      payload:
        $ref: '#/components/schemas/NarrativeChunkEnvelopePayload'
    ActionCommand:
      name: actionCommand
      title: Player action
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ActionRequest'
    NarrateCommand:
      name: narrateCommand
      title: Narration request
      contentType: application/json
      payload:
        type: object
        properties:
          prompt:
            type: string
            example: I search the altar for traps
  schemas:
    NarrativeEnvelopePayload:
      type: object
      required: [type, version, payload, requestId]
      properties:
        type:
          type: string
          example: narrative_update
        version:
          type: integer
          example: 1
        requestId:
          type: string
        payload:
          type: object
          properties:
            text: { type: string }
            provider: { type: string }
            tokensUsed: { type: integer }
            fallback: { type: boolean }
    NarrativeChunkEnvelopePayload:
      type: object
      required: [type, version, payload]
      properties:
        type:
          type: string
          example: narrative_chunk
        version:
          type: integer
          example: 1
        requestId:
          type: string
        payload:
          type: object
          properties:
            chunk: { type: string }
    ActionRequest:
      type: object
      required: [choiceLabel]
      properties:
        choiceLabel:
          type: string
          example: Attack
